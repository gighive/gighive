# --- T-86: innodb_lock_wait_timeout >= 60 ---
# Lifecycle: permanent — MySQL config can drift after restarts or container rebuilds.

- name: "[T-86] Read innodb_lock_wait_timeout"
  community.docker.docker_container_exec:
    container: "{{ mysql_container_name }}"
    command: >-
      sh -c "MYSQL_PWD={{ mysql_root_password | quote }} mysql -uroot -sN -e 'SELECT @@innodb_lock_wait_timeout'"
  register: lock_timeout
  changed_when: false
  no_log: true
  failed_when: false
  tags: [smoke, media_storage]

- name: "[T-86] Assert innodb_lock_wait_timeout >= 60"
  ansible.builtin.assert:
    that:
      - lock_timeout.rc == 0
      - lock_timeout.stdout | trim | int >= 60
    fail_msg: >
      innodb_lock_wait_timeout={{ lock_timeout.stdout | trim }}, expected >= 60.
      Add innodb_lock_wait_timeout=60 to MySQL [mysqld] config and restart.
  tags: [smoke, media_storage]
