# ============================================================
# Media Storage Backend checks (Phase 1 — Tranche 1)
# ============================================================

# --- T-8: GIGHIVE_MEDIA_STORAGE_BACKEND matches group vars ---

- name: "[T-8] Read GIGHIVE_MEDIA_STORAGE_BACKEND from Apache container"
  ansible.builtin.command: >
    docker exec -i "{{ apache_container_name }}" printenv GIGHIVE_MEDIA_STORAGE_BACKEND
  register: media_backend_env
  changed_when: false
  tags: [smoke, media_storage]

- name: "[T-8] Assert GIGHIVE_MEDIA_STORAGE_BACKEND equals gighive_media_storage_backend"
  ansible.builtin.assert:
    that:
      - media_backend_env.stdout | trim == gighive_media_storage_backend
    fail_msg: >
      Container GIGHIVE_MEDIA_STORAGE_BACKEND={{ media_backend_env.stdout | trim }},
      expected {{ gighive_media_storage_backend }}
  tags: [smoke, media_storage]

- name: "[T-8] Assert Azure Blob env vars are non-empty (Azure mode only)"
  ansible.builtin.command: >
    docker exec -i "{{ apache_container_name }}"
      sh -c 'test -n "$(printenv {{ item }})"'
  loop:
    - AZURE_BLOB_ACCOUNT_NAME
    - AZURE_BLOB_CONTAINER
    - AZURE_IDENTITY_CLIENT_ID
  changed_when: false
  when: gighive_media_storage_backend == 'azure_blob'
  tags: [smoke, media_storage]

# --- T-9: host.docker.internal extra_host present ---

- name: "[T-9] Read Apache container ExtraHosts"
  ansible.builtin.command: >
    docker inspect
      -f '{% raw %}{{range .HostConfig.ExtraHosts}}{{.}}{{"\n"}}{{end}}{% endraw %}'
      "{{ apache_container_name }}"
  register: container_extra_hosts
  changed_when: false
  tags: [smoke, media_storage]

- name: "[T-9] Assert host.docker.internal extra host is present"
  ansible.builtin.assert:
    that:
      - "'host.docker.internal' in container_extra_hosts.stdout"
    fail_msg: >
      host.docker.internal not found in ExtraHosts.
      Current ExtraHosts: {{ container_extra_hosts.stdout }}
  tags: [smoke, media_storage]

# --- T-10: IMDS reachable from Apache container (Azure mode only) ---

- name: "[T-10] IMDS instance endpoint reachable from Apache container (Azure mode only)"
  ansible.builtin.command: >
    docker exec -i "{{ apache_container_name }}"
      curl -sf -o /dev/null -w "%{http_code}"
        "http://169.254.169.254/metadata/instance?api-version=2021-02-01"
        -H "Metadata: true" --connect-timeout 5
  register: imds_instance_code
  changed_when: false
  when: gighive_media_storage_backend == 'azure_blob'
  tags: [smoke, media_storage]

- name: "[T-10] Assert IMDS returns 200 (Azure mode only)"
  ansible.builtin.assert:
    that:
      - imds_instance_code.stdout | trim == "200"
    fail_msg: >
      IMDS returned {{ imds_instance_code.stdout | trim }} (expected 200).
      Check extra_hosts host-gateway config and Azure VM identity assignment.
  when: gighive_media_storage_backend == 'azure_blob'
  tags: [smoke, media_storage]

# --- T-11 / T-12: bind mount presence checks ---

- name: "[T-11/T-12] Read Apache container mount sources"
  ansible.builtin.command: >
    docker inspect
      -f '{% raw %}{{range .Mounts}}{{.Source}}{{"\n"}}{{end}}{% endraw %}'
      "{{ apache_container_name }}"
  register: container_mounts
  changed_when: false
  tags: [smoke, media_storage]

- name: "[T-11] Assert no local audio/video bind mounts present (Azure mode)"
  ansible.builtin.assert:
    that:
      - container_mounts.stdout | regex_search('/audio') is none
      - container_mounts.stdout | regex_search('/video') is none
    fail_msg: >
      Local media bind mounts found in Azure mode.
      Mounts: {{ container_mounts.stdout }}
  when: gighive_media_storage_backend == 'azure_blob'
  tags: [smoke, media_storage]

- name: "[T-12] Assert audio and video host dirs are mounted (local mode)"
  ansible.builtin.assert:
    that:
      - container_mounts.stdout | regex_search('/audio') is not none
      - container_mounts.stdout | regex_search('/video') is not none
    fail_msg: >
      Expected audio/video bind mounts not found in local mode.
      Mounts: {{ container_mounts.stdout }}
  when: gighive_media_storage_backend != 'azure_blob'
  tags: [smoke, media_storage]

# --- T-13: clear_media_files.php does not 500 in Azure mode ---

- name: "[T-13] clear_media_files.php does not 500 without local media dirs (Azure mode)"
  ansible.builtin.uri:
    url: "{{ gighive_base_url }}/admin/clear_media_files.php"
    method: GET
    url_username: "{{ admin_user }}"
    url_password: "{{ gighive_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ gighive_validate_certs }}"
    status_code: [200, 302, 401, 403, 405]
    headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
  changed_when: false
  when: gighive_media_storage_backend == 'azure_blob'
  tags: [smoke, media_storage]

# ============================================================
# Phase 2 — Storage abstraction layer checks
# ============================================================

# --- T-71: PHP syntax check on all Phase 2 service files ---

- name: "[T-71] PHP syntax check all Phase 2 service files"
  community.docker.docker_container_exec:
    container: "{{ apache_container_name }}"
    command: >-
      php -l {{ item }}
  loop:
    - /var/www/html/src/Services/MediaBackend.php
    - /var/www/html/src/Contracts/MediaStorageBackendInterface.php
    - /var/www/html/src/Dto/MediaMetaDto.php
    - /var/www/html/src/Dto/CurlResult.php
    - /var/www/html/src/Services/AzureIdentityTokenCache.php
    - /var/www/html/src/Services/AzureBlobRestClient.php
    - /var/www/html/src/Services/AzureBlobMediaBackend.php
    - /var/www/html/src/Services/LocalMediaBackend.php
    - /var/www/html/src/Services/FallbackMediaBackend.php
    - /var/www/html/src/Services/MediaStorageService.php
  register: php_syntax_p2
  changed_when: false
  tags: [smoke, media_storage]

- name: "[T-71] Assert all Phase 2 service files pass php -l"
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: "PHP syntax error in {{ item.item }}: {{ item.stderr }}"
  loop: "{{ php_syntax_p2.results }}"
  tags: [smoke, media_storage]

# --- T-72: composer dump-autoload resolves all Phase 2 classes ---

- name: "[T-72] composer dump-autoload succeeds (Phase 2 classes are autoloadable)"
  community.docker.docker_container_exec:
    container: "{{ apache_container_name }}"
    command: >-
      /usr/local/bin/composer dump-autoload --working-dir=/var/www/html --no-interaction --quiet
  register: composer_autoload_p2
  changed_when: false
  failed_when: false
  tags: [smoke, media_storage]

- name: "[T-72] Assert composer dump-autoload exited 0"
  ansible.builtin.assert:
    that:
      - composer_autoload_p2.rc == 0
    fail_msg: >
      composer dump-autoload failed — check for missing files or namespace mismatches.
      Stderr: {{ composer_autoload_p2.stderr }}
  tags: [smoke, media_storage]

# --- T-73: APCu extension is loaded (required by AzureIdentityTokenCache) ---

- name: "[T-73] APCu extension is loaded inside the Apache container"
  community.docker.docker_container_exec:
    container: "{{ apache_container_name }}"
    command: >-
      php -r "exit(function_exists('apcu_store') ? 0 : 1);"
  register: apcu_check
  changed_when: false
  failed_when: false
  tags: [smoke, media_storage]

- name: "[T-73] Assert APCu is available"
  ansible.builtin.assert:
    that:
      - apcu_check.rc == 0
    fail_msg: >
      APCu extension not loaded — AzureIdentityTokenCache will fail to cache tokens.
      Ensure the php-apcu package is installed in the Apache container image.
  tags: [smoke, media_storage]

# --- T-74: MediaStorageService::make() instantiates without error in local mode ---
# Lifecycle: phase gate (Tranche 1) — remove at Tranche 1 cleanup.

- name: "[T-74] MediaStorageService::make() instantiates without exception (local mode)"
  community.docker.docker_container_exec:
    container: "{{ apache_container_name }}"
    command: >-
      php -r "require '/var/www/html/vendor/autoload.php'; \Production\Api\Services\MediaStorageService::make(); echo 'ok';"
  register: storage_make_check
  changed_when: false
  failed_when: false
  when: gighive_media_storage_backend == 'local'
  tags: [smoke, media_storage]

- name: "[T-74] Assert MediaStorageService::make() printed ok"
  ansible.builtin.assert:
    that:
      - storage_make_check.stdout | trim == 'ok'
    fail_msg: >
      \Production\Api\Services\MediaStorageService::make() threw an exception in local mode.
      Stderr: {{ storage_make_check.stderr }}
  when: gighive_media_storage_backend == 'local'
  tags: [smoke, media_storage]

# --- T-79: PHP >= 8.2 (required by HashContext serialization + readonly class) ---
# Lifecycle: permanent — keep in post_build_checks; base image updates can silently downgrade PHP.

- name: "[T-79] PHP version is >= 8.2 inside the Apache container"
  community.docker.docker_container_exec:
    container: "{{ apache_container_name }}"
    command: >-
      php -r "exit(PHP_MAJOR_VERSION > 8 || (PHP_MAJOR_VERSION === 8 && PHP_MINOR_VERSION >= 2) ? 0 : 1);"
  register: php_ver_p3
  changed_when: false
  failed_when: false
  tags: [smoke, media_storage]

- name: "[T-79] Assert PHP >= 8.2"
  ansible.builtin.assert:
    that:
      - php_ver_p3.rc == 0
    fail_msg: >
      PHP version is below 8.2 — HashContext serialization and readonly class require 8.2.
      Update the base image before deploying Phase 3.
  tags: [smoke, media_storage]

# --- T-80: tus_uploads table has all required columns ---
# Lifecycle: phase gate (Tranche 1) — remove at Tranche 1 cleanup.

- name: "[T-80] Count expected columns in tus_uploads"
  community.docker.docker_container_exec:
    container: "{{ mysql_container_name }}"
    command: >-
      sh -c "MYSQL_PWD={{ mysql_root_password | quote }} mysql -uroot media_db -sN
      -e \"SELECT COUNT(*) FROM INFORMATION_SCHEMA.COLUMNS
       WHERE TABLE_SCHEMA='media_db' AND TABLE_NAME='tus_uploads'
       AND COLUMN_NAME IN ('upload_id','user_id','status','upload_length',
       'block_count','block_size','sha256_ctx','file_type','asset_id','expires_at')\""
  register: tus_uploads_cols
  changed_when: false
  no_log: true
  failed_when: false
