---
# roles/post_build_tasks/tasks/main.yml

- name: Verify containers are running after reboot
  ansible.builtin.shell: >
    docker ps --filter "name={{ apache_container_name }}" --filter "name={{ mysql_container_name }}" --format '{% raw %}{{.Names}}: {{.Status}}{% endraw %}'
  register: container_status
  changed_when: false

- name: Get primary interface name
  shell: ip -4 route get 1.1.1.1 | awk '{print $5; exit}'
  register: primary_iface
  changed_when: false

- name: Get NIC state (UP/DOWN)
  shell: ip -o link show {{ primary_iface.stdout }} | awk '{print $9}'
  register: nic_state
  changed_when: false

- name: Get primary IPv4 address
  shell: ip -4 addr show {{ primary_iface.stdout }} | grep inet | awk '{print $2}' | cut -d/ -f1
  register: ip_address
  changed_when: false

- name: Check multiple Docker containers
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: container_info
  loop:
    - "{{ apache_container_name }}"
    - "{{ mysql_container_name }}"
  ignore_errors: true

- name: Fail if any container isn’t running
  fail:
    msg: "Container {{ item.item }} is not running (exists={{ item.exists }})"
  when:
    - item.exists
    - not item.container.State.Running
  loop: "{{ container_info.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Check free memory
  shell: free -m | grep Mem | awk '{print $4}'
  register: mem_free
  changed_when: false

- name: Check free disk space
  shell: df -h / | grep -v Filesystem | awk '{print $4}'
  register: disk_free
  changed_when: false

- name: Check Docker service status
  service_facts:

- name: Get system load average
  shell: uptime | awk -F'load average:' '{ print $2 }' | sed 's/^[[:space:]]*//'
  register: load_avg
  changed_when: false

- name: Build Full Health Summary
  set_fact:
    summary:
      NIC_State: "{{ nic_state.stdout }}"
      IP_Address: "{{ ip_address.stdout }}"
      Containers_Running: >-
        {{ (container_info.results | selectattr('item', 'equalto', apache_container_name) | map(attribute='container.State.Running') | list | first)
            | default('Container Not Found') }}
      Free_Memory_MB: "{{ mem_free.stdout }}"
      Free_Disk_Space_Root: "{{ disk_free.stdout }}"
      Docker_Service_Running: "{{ ansible_facts['services']['docker'].state == 'running' if 'docker' in ansible_facts['services'] else 'Docker Not Found' }}"
      Load_Average: "{{ load_avg.stdout }}"

- name: Display Full Health Summary
  debug:
    var: summary

- name: Pause for X seconds to let the stack settle
  pause:
    seconds: 90 
    prompt: ""   # omit the “Press ENT

- name: Assert htpasswd exists on host (bind-mount source)
  ansible.builtin.stat:
    path: "{{ gighive_htpasswd_host_path }}"
  register: ht_host

- name: Fail if htpasswd missing on host
  ansible.builtin.fail:
    msg: "Expected htpasswd at {{ gighive_htpasswd_host_path }} (bind-mount to {{ gighive_htpasswd_path }}) but the file is missing on the host."
  when: not ht_host.stat.exists

# use shell builtin 'test' via sh -lc
- name: Check htpasswd readable inside container (root)
  ansible.builtin.command: docker exec -i "{{ apache_container_name }}" sh -lc 'test -r "{{ gighive_htpasswd_path }}"'
  register: ht_in_root
  changed_when: false
  failed_when: false

- name: Check htpasswd readable inside container as www-data
  ansible.builtin.command: docker exec -u www-data -i "{{ apache_container_name }}" sh -lc 'test -r "{{ gighive_htpasswd_path }}"'
  register: ht_in_www
  changed_when: false
  failed_when: false

# if either check fails, show useful details without printing file contents
- name: Show container mounts when htpasswd not visible (debug aid)
  ansible.builtin.command: >
    docker inspect -f '{{"{{"}}range .Mounts{{"}}"}}{{"{{"}}println .Source "->" .Destination{{"}}"}}{{"{{"}}end{{"}}"}}' "{{ apache_container_name }}"
  register: apache_mounts
  when: ht_in_root.rc != 0 or ht_in_www.rc != 0
  changed_when: false

- name: Show stat/owner seen inside container (no secrets)
  ansible.builtin.command: >
    docker exec -i "{{ apache_container_name }}" sh -lc
    'id;
     ls -l "{{ gighive_htpasswd_path }}" || true;
     stat -c "%A %U:%G %a %u:%g %n" "{{ gighive_htpasswd_path }}" || true'
  register: ht_stat
  when: ht_in_root.rc != 0 or ht_in_www.rc != 0
  changed_when: false

- name: Fail if htpasswd not readable inside container
  ansible.builtin.fail:
    msg: >
      htpasswd not readable at {{ gighive_htpasswd_path }}.
      root_rc={{ ht_in_root.rc }}, www_rc={{ ht_in_www.rc }}.
      Mounts:
      {{ apache_mounts.stdout | default('N/A') }}
      Stat:
      {{ ht_stat.stdout | default('N/A') }}
  when: ht_in_root.rc != 0 or ht_in_www.rc != 0

- name: Enable Apache headers module
  command: docker exec -i "{{ apache_container_name }}" a2enmod headers
  register: headers_mod
  changed_when: "'enabled' in (headers_mod.stdout | default(''))"
  failed_when: headers_mod.rc not in [0]
  tags: [hardening]

- name: Graceful reload Apache if headers was enabled
  command: docker exec -i "{{ apache_container_name }}" apache2ctl -k graceful
  when: "'enabled' in (headers_mod.stdout | default(''))"
  changed_when: false
  tags: [hardening]

# --- HTTP smoke tests ---

- name: Home should be public (200)
  uri:
    url: "{{ gighive_base_url }}/"
    method: GET
    validate_certs: "{{ gighive_validate_certs }}"
    return_content: no
    status_code: 200
    headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
  changed_when: false
  tags: [smoke]

- name: /src should require auth (401)
  uri:
    url: "{{ gighive_base_url }}/src/index.php"
    method: GET
    validate_certs: "{{ gighive_validate_certs }}"
    return_content: no
    status_code: 401
    headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
  changed_when: false
  tags: [smoke]

- block:
    - name: Webroot (probe)
      uri:
        url: "{{ gighive_base_url }}/"
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
        method: GET
        follow_redirects: all
        return_content: yes
        status_code: [200]      # keep it strict for now
      register: webroot_probe
      changed_when: false
      no_log: false             # TEMP: show status/headers/body if it fails
      tags: [smoke]

  rescue:
    - name: Show Apache error log tail (last 100 lines)
      command: docker exec -i "{{ apache_container_name }}" sh -lc 'tail -n 100 ${APACHE_LOG_DIR:-/var/log/apache2}/error.log'
      register: apache_error_tail
      changed_when: false
      failed_when: false
      tags: [smoke]

    - name: Summarize /src failure
      debug:
        msg:
          - "STATUS={{ src_admin.status | default('n/a') }}"
          - "LOCATION={{ (src_admin.location | default('')) }}"
          - "BODY_START={{ (src_admin.content | default(''))[:300] | replace('\n',' ') }}"
          - "APACHE_ERROR_TAIL:\n{{ apache_error_tail.stdout | default('') }}"
      changed_when: false
      tags: [smoke]

    # Don't fail the whole play while we investigate
    - meta: clear_host_errors

- name: Cache dir should not be web-accessible (403)
  uri:
    url: "{{ gighive_base_url }}/app/cache/"
    validate_certs: "{{ gighive_validate_certs }}"
    status_code: 403
    headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
  changed_when: false

- name: Generate manifest status smoke-test job_id
  ansible.builtin.set_fact:
    manifest_smoke_job_id: "20990101-000000-{{ lookup('password', '/dev/null length=12 chars=hexdigits') | lower }}"
  changed_when: false
  tags: [smoke]

- block:
    - name: Write manifest smoke-test status.json inside apache container (python)
      community.docker.docker_container_exec:
        container: "{{ apache_container_name }}"
        command: >-
          /bin/sh -lc "python3 -c 'import json, os; jid=\"{{ manifest_smoke_job_id }}\"; jobdir=f\"/var/www/private/import_jobs/{jid}\"; os.makedirs(jobdir, exist_ok=True); p=f\"{jobdir}/status.json\"; data={\"success\": True, \"job_id\": jid, \"state\": \"running\", \"message\": \"post_build_checks smoke test\", \"updated_at\": \"2099-01-01T00:00:00Z\"}; open(p, \"w\", encoding=\"utf-8\").write(json.dumps(data)); os.chmod(p, 0o644)' && chown www-data:www-data /var/www/private/import_jobs/{{ manifest_smoke_job_id }}/status.json"
      changed_when: false

    - name: Verify import_manifest_status.php returns our synthetic status.json
      ansible.builtin.uri:
        url: "{{ gighive_base_url }}/admin/import_manifest_status.php?job_id={{ manifest_smoke_job_id }}"
        method: GET
        url_username: "admin"
        url_password: "{{ gighive_admin_password }}"
        force_basic_auth: true
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else omit }}"
        return_content: true
        status_code: 200
      register: manifest_status_smoke_resp
      changed_when: false

    - name: Assert manifest status smoke-test response
      ansible.builtin.assert:
        that:
          - manifest_status_smoke_resp.json is mapping
          - (manifest_status_smoke_resp.json.success | default(false)) == true
          - (manifest_status_smoke_resp.json.job_id | default('')) == manifest_smoke_job_id
          - (manifest_status_smoke_resp.json.state | default('')) == 'running'
          - (manifest_status_smoke_resp.json.message | default('')) == 'post_build_checks smoke test'
      changed_when: false

  always:
    - name: Cleanup manifest smoke-test job directory
      community.docker.docker_container_exec:
        container: "{{ apache_container_name }}"
        command: >-
          /bin/sh -lc "rm -rf /var/www/private/import_jobs/{{ manifest_smoke_job_id }}"
      changed_when: false
      failed_when: false
  tags: [smoke]

# --- TUS verification (external URL) ---

# Step 1: set the base64 literal and scalar vars first.
- name: Build variables for TUS checks (step 1 — payload b64 + scalars)
  ansible.builtin.set_fact:
    # Minimal valid WAV file (44-byte RIFF header + 0 data bytes).
    # Must be real WAV magic bytes so the final-PATCH MIME sniff passes audio/wav.
    # Base64 of: RIFF\x24\x00\x00\x00WAVEfmt \x10\x00\x00\x00\x01\x00\x01\x00
    #            \x44\xac\x00\x00\x88\x58\x01\x00\x02\x00\x10\x00data\x00\x00\x00\x00
    tus_payload_b64: "UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA="
    tus_expected_offset: 44
    tus_upload_metadata_filename_b64: "{{ 'verify.wav' | b64encode }}"
    tus_upload_metadata_filetype_b64: "{{ 'audio/wav' | b64encode }}"
    tus_upload_metadata_label_b64: "{{ 'TUS_VALIDATE' | b64encode }}"
    tus_upload_metadata_org_name_b64: "{{ 'gighive' | b64encode }}"
    tus_upload_metadata_event_date_b64: "{{ ansible_facts['date_time'].date | b64encode }}"
    tus_upload_metadata_event_type_b64: "{{ 'band' | b64encode }}"
    tus_headers_common: "{{ {'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else {} }}"
    tus_checks_no_log: "{{ tus_checks_no_log | default((ansible_verbosity | int) < 2) }}"
  changed_when: false
  tags: [tus]

# Step 2: decode the payload now that tus_payload_b64 is defined.
- name: Build variables for TUS checks (step 2 — decode payload)
  ansible.builtin.set_fact:
    tus_payload: "{{ tus_payload_b64 | b64decode }}"
  changed_when: false
  tags: [tus]

# tusd is retired (Phase 3). The [tus] block below tests the PHP tus endpoint instead.
# The old tasks that checked the tusd container, internal tusd DNS probe, and
# tus-hooks/tus-data staging artifacts have been removed.

- block:
    - name: TUS endpoint should require auth (probe)
      ansible.builtin.uri:
        url: "{{ gighive_base_url }}/files/"
        method: OPTIONS
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ tus_headers_common | combine({'Tus-Resumable': '1.0.0'}) }}"
        status_code: [401, 403]
        return_content: false
      register: tus_auth_probe
      changed_when: false

    - name: Create TUS upload (POST /tus)
      ansible.builtin.uri:
        url: "{{ gighive_base_url }}/files/"
        method: POST
        url_username: "{{ uploader_user }}"
        url_password: "{{ gighive_uploader_password }}"
        force_basic_auth: true
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ tus_headers_common | combine({
          'Tus-Resumable': '1.0.0',
          'Upload-Length': tus_expected_offset | string,
          'Upload-Metadata': (
            'filename ' ~ tus_upload_metadata_filename_b64 ~
            ',filetype ' ~ tus_upload_metadata_filetype_b64 ~
            ',label ' ~ tus_upload_metadata_label_b64 ~
            ',org_name ' ~ tus_upload_metadata_org_name_b64 ~
            ',event_date ' ~ tus_upload_metadata_event_date_b64 ~
            ',event_type ' ~ tus_upload_metadata_event_type_b64
          )
        }) }}"
        status_code: [201]
        return_content: true
      register: tus_create
      changed_when: false
      no_log: false

    - name: Capture upload Location + upload_id
      ansible.builtin.set_fact:
        tus_upload_location: "{{ tus_create.location | default('') }}"
        tus_upload_id: "{{ (tus_create.location | default('')).split('/')[-1] }}"
        tus_public_upload_url: "{{ gighive_base_url }}/files/{{ (tus_create.location | default('')).split('/')[-1] }}"
      changed_when: false

    - name: Assert Location header was returned
      ansible.builtin.assert:
        that:
          - tus_upload_location | length > 0
          - tus_upload_id | length > 0
      changed_when: false

    # The PATCH body is binary (WAV magic bytes). Ansible's uri module serializes task
    # parameters as UTF-8 JSON and chokes on raw binary bytes. We work around this by:
    #   1. Writing the base64 string into a temp file inside the apache container.
    #   2. Decoding it to binary in-place with `base64 -d`.
    #   3. Sending it with curl --data-binary @<file> — no shell quoting of binary,
    #      no herestring trailing-newline, no password on the Ansible command line.
    # The PATCH body is binary (WAV magic bytes). Strategy:
    #   1. Write payload b64 to a temp file via docker exec with -e env vars so that
    #      credentials and the b64 string never appear in single-quoted shell arguments
    #      (avoids breakage if values contain single quotes).
    #   2. Decode b64 to binary inside the container and pipe to curl.
    #   3. Use a netrc file (mode 600) so credentials stay off the curl argument list.
    - name: Write TUS PATCH payload and netrc into apache container
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -e
          - TUS_PAYLOAD_B64={{ tus_payload_b64 }}
          - -e
          - TUS_USER={{ uploader_user }}
          - -e
          - TUS_PASS={{ gighive_uploader_password }}
          - "{{ apache_container_name }}"
          - sh
          - -c
          - |
            printf '%s' "$TUS_PAYLOAD_B64" > /tmp/tus_smoke_payload.b64
            printf 'default login %s password %s\n' "$TUS_USER" "$TUS_PASS" > /tmp/tus_smoke.netrc
            chmod 600 /tmp/tus_smoke.netrc
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Upload a small payload via TUS (PATCH)
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ apache_container_name }}"
          - sh
          - -c
          - >-
            base64 -d /tmp/tus_smoke_payload.b64 |
            curl -sS --http1.1 --netrc-file /tmp/tus_smoke.netrc
            {{ "-k" if not (gighive_validate_certs | default(true)) else "" }}
            -X PATCH
            -H "Tus-Resumable: 1.0.0"
            -H "Upload-Offset: 0"
            -H "Content-Type: application/offset+octet-stream"
            -H "Content-Length: {{ tus_expected_offset }}"
            {{ ('-H "Host: ' ~ gighive_hostname_for_host_header ~ '"') if (gighive_hostname_for_host_header | length) > 0 else "" }}
            --data-binary @-
            -o /dev/null
            -w "%{http_code}"
            "{{ tus_public_upload_url }}"
      register: tus_patch
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Assert PATCH returned 204
      ansible.builtin.assert:
        that:
          - tus_patch.stdout | trim == '204'
        fail_msg: "TUS PATCH expected 204, got '{{ tus_patch.stdout | trim }}'"
      changed_when: false

    - name: Remove TUS PATCH payload and netrc temp files from apache container
      ansible.builtin.command: >
        docker exec {{ apache_container_name }}
        sh -c 'rm -f /tmp/tus_smoke_payload.b64 /tmp/tus_smoke.netrc'
      changed_when: false
      failed_when: false

    - name: Verify upload offset via TUS (HEAD)
      ansible.builtin.command: >
        sh -lc
        'curl -sS --http1.1 {{ "-k" if not (gighive_validate_certs | default(true)) else "" }} -u "{{ uploader_user }}:{{ gighive_uploader_password }}" -I "{{ tus_public_upload_url }}" -H "Tus-Resumable: 1.0.0" -D - -o /dev/null | tr -d "\r" | awk -F": " "tolower(\$1)==\"upload-offset\"{print \$2; exit}"'
      register: tus_head
      changed_when: false
      failed_when: tus_head.rc not in [0, 18]
      no_log: "{{ tus_checks_no_log }}"

    - name: Extract Upload-Offset header value
      ansible.builtin.set_fact:
        tus_upload_offset_value: "{{ tus_head.stdout | default('') | trim }}"
      changed_when: false

    - name: Assert TUS offset matches payload length
      ansible.builtin.assert:
        that:
          - (tus_upload_offset_value | default('')) | string == (tus_expected_offset | string)
        fail_msg: "Expected Upload-Offset={{ tus_expected_offset }}, got '{{ tus_upload_offset_value | default('') }}'"
      changed_when: false

    - name: Finalize TUS upload (POST /api/uploads/finalize)
      ansible.builtin.uri:
        url: "{{ gighive_base_url }}/api/uploads/finalize"
        method: POST
        url_username: "{{ uploader_user }}"
        url_password: "{{ gighive_uploader_password }}"
        force_basic_auth: true
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ ({'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else {}) | combine({'Content-Type':'application/json'}) }}"
        body_format: json
        body:
          upload_id: "{{ tus_upload_id }}"
        status_code: 201
        return_content: true
      register: tus_finalize_1
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Finalize again (idempotency)
      ansible.builtin.uri:
        url: "{{ gighive_base_url }}/api/uploads/finalize"
        method: POST
        url_username: "{{ uploader_user }}"
        url_password: "{{ gighive_uploader_password }}"
        force_basic_auth: true
        validate_certs: "{{ gighive_validate_certs }}"
        headers: "{{ ({'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else {}) | combine({'Content-Type':'application/json'}) }}"
        body_format: json
        body:
          upload_id: "{{ tus_upload_id }}"
        status_code: 201
        return_content: true
      register: tus_finalize_2
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Assert finalize idempotency (same asset_id both calls)
      ansible.builtin.assert:
        that:
          - tus_finalize_1.json is mapping
          - tus_finalize_2.json is mapping
          - (tus_finalize_1.json.asset_id | int) == (tus_finalize_2.json.asset_id | int)
          - (tus_finalize_1.json.file_name | default('')) == (tus_finalize_2.json.file_name | default(''))
          - tus_finalize_1.json.db_done == true
      changed_when: false

    # Phase 3: finalizeTusUpload() no longer returns delete_token (that was the old
    # tusd hook-file path). The asset is cleaned up via admin delete directly.
    - name: Assert tus_uploads row is complete in DB
      community.docker.docker_container_exec:
        container: "{{ mysql_container_name }}"
        command: >-
          sh -c "MYSQL_PWD={{ mysql_root_password | quote }} mysql -uroot media_db -sN
          -e \"SELECT status FROM tus_uploads WHERE upload_id='{{ tus_upload_id }}'\""
      register: tus_db_status
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Assert tus_uploads.status is complete
      ansible.builtin.assert:
        that:
          - tus_db_status.stdout | trim == 'complete'
        fail_msg: >-
          Expected tus_uploads.status=complete for upload_id={{ tus_upload_id }},
          got '{{ tus_db_status.stdout | trim }}'
      changed_when: false

    - name: Assert probe_jobs row was enqueued
      community.docker.docker_container_exec:
        container: "{{ mysql_container_name }}"
        command: >-
          sh -c "MYSQL_PWD={{ mysql_root_password | quote }} mysql -uroot media_db -sN
          -e \"SELECT COUNT(*) FROM probe_jobs WHERE asset_id={{ tus_finalize_1.json.asset_id | int }}\""
      register: tus_probe_job_count
      changed_when: false
      no_log: "{{ tus_checks_no_log }}"

    - name: Assert probe_jobs has exactly 1 row for the uploaded asset
      ansible.builtin.assert:
        that:
          - tus_probe_job_count.stdout | trim | int == 1
        fail_msg: >-
          Expected 1 probe_jobs row for asset_id={{ tus_finalize_1.json.asset_id }},
          got {{ tus_probe_job_count.stdout | trim }}
      changed_when: false

    - block:
        - name: Assert TUS smoke-test asset_id looks valid before cleanup
          ansible.builtin.assert:
            that:
              - (tus_finalize_1.json.asset_id | default('') | string) is regex('^[0-9]+$')
              - (tus_finalize_1.json.asset_id | int) > 0
            fail_msg: >-
              Refusing to cleanup — finalize response has invalid asset_id.
              asset_id='{{ tus_finalize_1.json.asset_id | default('') }}'
          changed_when: false

        - name: Delete TUS smoke-test asset (DB + served file)
          ansible.builtin.uri:
            url: "{{ gighive_base_url }}/db/delete_media_files.php"
            method: POST
            url_username: "admin"
            url_password: "{{ gighive_admin_password }}"
            force_basic_auth: true
            validate_certs: "{{ gighive_validate_certs }}"
            headers: "{{ ({'Host': gighive_hostname_for_host_header} if (gighive_hostname_for_host_header | length) > 0 else {}) | combine({'Content-Type':'application/json'}) }}"
            body_format: json
            body:
              asset_ids:
                - "{{ tus_finalize_1.json.asset_id | int }}"
            status_code: [200]
            return_content: true
          register: tus_cleanup_delete
          changed_when: false
          no_log: "{{ tus_checks_no_log }}"

        - name: Assert cleanup delete removed 1 row
          ansible.builtin.assert:
            that:
              - tus_cleanup_delete.json is mapping
              - (tus_cleanup_delete.json.deleted_count | default(0) | int) == 1
              - (tus_cleanup_delete.json.error_count | default(0) | int) == 0
            fail_msg: >-
              Cleanup delete failed. Response={{ tus_cleanup_delete.content | default('') }}
          changed_when: false

      when: tus_cleanup_after_check | default(true)

  tags: [tus]


# --- Stack Versions Summary ---

- name: Stat VERSION file on controller
  ansible.builtin.stat:
    path: "{{ repo_root }}/VERSION"
  register: stack_version_file_stat
  delegate_to: localhost
  become: false
  tags: [stack_versions]

- name: Read VERSION file on controller
  ansible.builtin.slurp:
    src: "{{ repo_root }}/VERSION"
  register: stack_version_file_slurp
  delegate_to: localhost
  become: false
  when: stack_version_file_stat.stat.exists
  tags: [stack_versions]

- name: Get git SHA on controller (VERSION file absent)
  ansible.builtin.command: git -C {{ repo_root }} rev-parse --short HEAD
  register: stack_git_sha_raw
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when: not stack_version_file_stat.stat.exists
  tags: [stack_versions]

- name: Set GigHive app version fact
  ansible.builtin.set_fact:
    stack_gighive_version: >-
      {{
        (stack_version_file_slurp.content | default('') | b64decode | trim)
        if stack_version_file_stat.stat.exists
        else ((stack_git_sha_raw.stdout | default('') | trim) or 'unknown')
      }}
  changed_when: false
  tags: [stack_versions]

- name: Get Docker host version
  ansible.builtin.command: docker --version
  register: stack_docker_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

- name: Get PHP version from apache container
  ansible.builtin.command: docker exec {{ apache_container_name }} php --version
  register: stack_php_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

- name: Get PHP-FPM version from apache container
  ansible.builtin.command: >
    docker exec {{ apache_container_name }}
    php-fpm{{ gighive_php_version | default('8.3') }} --version
  register: stack_php_fpm_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

- name: Get Composer version from apache container
  ansible.builtin.command: docker exec {{ apache_container_name }} composer --version
  register: stack_composer_version_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

- name: Get Apache version from apache container
  ansible.builtin.command: docker exec {{ apache_container_name }} apache2 -v
  register: stack_apache_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

- name: Get MySQL version from mysql container
  ansible.builtin.command: docker exec {{ mysql_container_name }} mysql --version
  register: stack_mysql_raw
  changed_when: false
  failed_when: false
  tags: [stack_versions]

# tusd retired (Phase 3) — stack_tusd_raw kept as an empty placeholder so downstream
# tasks that reference it (e.g. the stack summary) do not crash.
- name: tusd retired — set empty stack_tusd_raw placeholder
  ansible.builtin.set_fact:
    stack_tusd_raw:
      stdout: "tusd retired (Phase 3)"
      rc: 0
  changed_when: false
  tags: [stack_versions]

- name: Get MCP server package version from host virtualenv
  ansible.builtin.command: "{{ mcp_server_dir }}/venv/bin/pip show mcp"
  register: stack_mcp_raw
  changed_when: false
  failed_when: false
  when: mcp_server_enabled | default(false) | bool
  tags: [stack_versions]

- name: Slurp composer.lock on controller
  ansible.builtin.slurp:
    src: "{{ repo_root }}/ansible/roles/docker/files/apache/webroot/composer.lock"
  register: stack_composer_lock_raw
  delegate_to: localhost
  become: false
  tags: [stack_versions]

- name: Build Composer packages fact
  ansible.builtin.set_fact:
    stack_composer_packages: >-
      {{
        (stack_composer_lock_raw.content | b64decode | from_json).packages
        | items2dict(key_name='name', value_name='version')
      }}
  changed_when: false
  tags: [stack_versions]

- name: Build Stack Versions Summary
  ansible.builtin.set_fact:
    stack_versions_summary:
      GigHive_App: "{{ stack_gighive_version }}"
      GigHive_iOS: "{{ gighive_ios_app_version }}"
      Ubuntu: "{{ ubuntu_version }}"
      PHP: "{{ (stack_php_raw.stdout_lines | default(['N/A'])) | first }}"
      PHP_FPM: "{{ (stack_php_fpm_raw.stdout_lines | default(['N/A'])) | first }}"
      Composer: "{{ stack_composer_version_raw.stdout | default('N/A') | trim }}"
      Apache: "{{ (stack_apache_raw.stdout_lines | default(['N/A'])) | first }}"
      MySQL: "{{ stack_mysql_raw.stdout | default('N/A') | trim }}"
      tusd: "{{ (stack_tusd_raw.stdout_lines | default(['N/A'])) | first }}"
      Docker: "{{ stack_docker_raw.stdout | default('N/A') | trim }}"
      MCP_Python_SDK: "{{ ((stack_mcp_raw.stdout_lines | default([])) | select('match', '^Version: ') | list | first | default('Version: N/A')) | regex_replace('^Version: ', '') if (mcp_server_enabled | default(false) | bool) else 'disabled' }}"
      OpenAI_Model: "{{ openai_model }}"
      App_Flavor: "{{ app_flavor }}"
      QR_Code_JS: "{{ qr_code_js_version | default('N/A') }}"

      Composer_PHP_Dependency_Manager_Packages: "{{ stack_composer_packages }}"
  changed_when: false
  tags: [stack_versions]

- name: Display Stack Versions Summary
  ansible.builtin.debug:
    var: stack_versions_summary
  tags: [stack_versions]

# --- Azure Blob Storage connectivity (conditional on credentials) ---

- name: Build Azure connectivity probe facts
  ansible.builtin.set_fact:
    azure_probe_url: "https://{{ azure_blob_account_name }}.blob.core.windows.net/{{ azure_blob_container }}/test-connectivity/ansible-probe-{{ ansible_facts['date_time'].epoch }}.txt?{{ azure_blob_sas_token }}"
  when:
    - azure_blob_account_name | default('', true) | length > 0
    - azure_blob_container    | default('', true) | length > 0
    - azure_blob_sas_token    | default('', true) | length > 0
  no_log: true
  tags: [smoke, azure]

- block:
    - name: PUT sentinel blob to Azure (connectivity check)
      ansible.builtin.uri:
        url: "{{ azure_probe_url }}"
        method: PUT
        body: "gighive-azure-connectivity-probe"
        body_format: raw
        headers:
          x-ms-blob-type: BlockBlob
          Content-Type: text/plain
          x-ms-version: "2020-04-08"
        status_code: 201
        return_content: false
      changed_when: false
      no_log: true

    - name: Assert Azure blob PUT succeeded
      ansible.builtin.debug:
        msg: "Azure Blob Storage connectivity OK — credentials valid, Write+Create confirmed"

  always:
    - name: DELETE Azure connectivity probe blob (cleanup)
      ansible.builtin.uri:
        url: "{{ azure_probe_url }}"
        method: DELETE
        status_code: [202, 404]
        return_content: false
      changed_when: false
      failed_when: false
      no_log: true

  when: azure_probe_url is defined
  tags: [smoke, azure]

