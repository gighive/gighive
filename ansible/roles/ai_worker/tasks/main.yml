---
- name: Assert OPENAI_API_KEY is set when AI worker is enabled
  ansible.builtin.assert:
    that: openai_api_key is defined and openai_api_key | length > 0
    fail_msg: "OPENAI_API_KEY must be defined in secrets.yml when ai_worker_enabled=true"
  when: ai_worker_enabled | default(false) | bool

- name: Create ai_assets directory tree on host
  ansible.builtin.file:
    path: "{{ gighive_home }}/ai_assets/{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"
  loop:
    - frames
    - diagnostics
    - thumbnails
  when: ai_worker_enabled | default(false) | bool

- name: Sync ai-worker Python source to host
  ansible.posix.synchronize:
    src: "ai-worker/"
    dest: "{{ gighive_home }}/ai-worker/"
    delete: yes
    rsync_opts:
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
  notify: restart ai-worker
  when: ai_worker_enabled | default(false) | bool

- name: Render ai-worker docker-compose fragment
  ansible.builtin.template:
    src: docker-compose-ai-worker.yml.j2
    dest: "{{ docker_dir }}/docker-compose-ai-worker.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  notify: restart ai-worker
  when: ai_worker_enabled | default(false) | bool

- name: Get all locally available Docker image IDs
  community.docker.docker_host_info:
    images: true
  register: docker_host_facts
  when: ai_worker_enabled | default(false) | bool

- name: Inspect project containers for stale image references
  community.docker.docker_container_info:
    name: "{{ item }}"
  register: project_containers
  loop:
    - "{{ apache_container_name }}"
    - "{{ mysql_container_name }}"
    - ai-worker
  when: ai_worker_enabled | default(false) | bool

- name: Build available image ID set
  ansible.builtin.set_fact:
    _available_image_ids: "{{ docker_host_facts.images | map(attribute='Id') | list }}"
  when: ai_worker_enabled | default(false) | bool

- name: Remove project containers whose image is no longer available locally
  community.docker.docker_container:
    name: "{{ item.item }}"
    state: absent
    force_kill: true
  loop: "{{ (project_containers.results | default([])) | selectattr('exists', 'equalto', true) | list }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - ai_worker_enabled | default(false) | bool
    - item.container.Image not in (_available_image_ids | default([]))

- name: Tear down ai-worker compose state to clear any stale image references
  community.docker.docker_compose_v2:
    project_src: "{{ docker_dir }}"
    files:
      - docker-compose.yml
      - docker-compose-ai-worker.yml
    services:
      - ai-worker
    state: absent
    remove_orphans: true
  failed_when: false
  when: ai_worker_enabled | default(false) | bool

- name: Deploy ai-worker container
  community.docker.docker_compose_v2:
    project_src: "{{ docker_dir }}"
    files:
      - docker-compose.yml
      - docker-compose-ai-worker.yml
    services:
      - ai-worker
    state: present
    build: always
  when: ai_worker_enabled | default(false) | bool

- name: Run ai-worker role validation
  ansible.builtin.include_tasks: validate.yml
