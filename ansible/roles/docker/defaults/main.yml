---
# roles/docker/defaults/main.yml

# prereqs for adding the Docker repo
docker_prereq_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - software-properties-common

docker_apt_key_url: https://download.docker.com/linux/ubuntu/gpg

# this will auto-adapt to focal, jammy, bionic, etc.
docker_apt_repo: >
  deb [arch=amd64] https://download.docker.com/linux/ubuntu
  {{ ansible_facts['lsb']['codename'] }} stable

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin

# Pinned (tag + multi-arch digest); bump deliberately after a DB backup.
mysql_docker_image: "mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902"
